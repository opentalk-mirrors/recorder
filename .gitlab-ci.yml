---
image: git.opentalk.dev:5050/opentalk/backend/containers/rust:alpine3.19

stages:
  - lint
  - test
  - build
  - trigger

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # Enable one network per build for the test container and services
  FF_NETWORK_PER_BUILD: 'true'

.default_job_condition: &default_job_condition
  needs: []
  rules:
    # Run in merge requests (if there is one job with this instruction, all jobs without
    # it are ignored for the MR pipeline)
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # Run on scheduled pipeline runs
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    # Run on feature branches if there is no MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

lint:fmt:
  stage: lint
  <<: *default_job_condition
  before_script:
    - rustup component add rustfmt --toolchain nightly
  script:
    - cargo +nightly fmt -- --check

lint:clippy:
  stage: lint
  <<: *default_job_condition
  before_script:
    - >
      apk add --no-cache
      glib-dev openssl-dev
      gstreamer-dev gst-plugins-base-dev gst-plugins-bad-dev
  script:
    # Use clippy::pedantic for the entire source code
    # TODO: This it temporary and this rules will be added in the future
    - >
      cargo clippy --all-features
      -- --deny warnings --deny clippy::pedantic
      --allow clippy::cast-possible-truncation
      --allow clippy::cast-possible-wrap
      --allow clippy::cast-precision-loss
      --allow clippy::cast-sign-loss
      --allow clippy::doc-markdown
    # Use clippy::all for tests
    - >
      cargo clippy --all-features --tests
      -- --deny warnings --deny clippy::all

lint:dependency_check_advisories:
  stage: lint
  <<: *default_job_condition
  allow_failure: true
  script: cargo deny check advisories

lint:dependency_check_bans_licenses_sources:
  stage: lint
  <<: *default_job_condition
  script: cargo deny check bans licenses sources

lint:yaml:
  stage: lint
  <<: *default_job_condition
  image: alpine:3.19
  before_script:
    - apk add --no-cache yamllint
  script: yamllint .

lint:markdown:
  stage: lint
  <<: *default_job_condition
  image: registry.gitlab.com/pipeline-components/markdownlint:latest
  script:
    - mdl --style .markdown_style.rb  --warnings .

lint:licensing:
  stage: lint
  <<: *default_job_condition
  image:
    name: fsfe/reuse:latest
    entrypoint: ['']
  script:
    - reuse lint

test:cargo_test:
  stage: test
  <<: *default_job_condition
  artifacts:
    paths:
      - target/coverage/html
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/coverage/cobertura.xml
  coverage: '/Coverage: \d+(?:\.\d+)?/'
  variables:
    COVERAGE_XML_PATH: 'concat("Coverage: ", 100 * string(//coverage/@line-rate), "%")'
    RUSTFLAGS: -Ctarget-feature=-crt-static -Cinstrument-coverage -Clink-arg=-fuse-ld=lld
    LLVM_PROFILE_FILE: ./target/coverage/raw/coverage-%p-%m.profraw
  before_script:
    - >
      apk add --no-cache
      glib-dev openssl-dev
      gstreamer-dev gst-plugins-base-dev gst-plugins-bad-dev
      gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly libnice-gstreamer gst-libav ffmpeg
  script:
    # tests wetc_scenario1 is ignored until fixed
    - >
      cargo test
      --workspace
      --locked
      --
      --test-threads 1

    # Extract code coverage data
    - >
      grcov target/coverage/raw
      --binary-path ./target/debug/
      --source-dir .
      --output-types cobertura,html
      --branch
      --ignore-not-existing
      --ignore "*cargo*"
      --output-path target/coverage

    # Print out the coverage percentage for GitLab
    - xmllint --xpath "$COVERAGE_XML_PATH" target/coverage/cobertura.xml

test:doc:
  stage: test
  <<: *default_job_condition
  before_script:
    - >
      apk add --no-cache
      glib-dev openssl-dev
      gstreamer-dev gst-plugins-base-dev gst-plugins-bad-dev
  script:
    - cargo doc --workspace --verbose

trigger-docs:
  stage: trigger
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PROJECT_NAME !~ /^.*canary$/ || $CI_COMMIT_TAG =~ /^v.*$/
  trigger:
    project: opentalk/backend/docs

build:container:
  stage: build
  variables:
    IMAGE_DESTINATION_ARGS: --no-push
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        IMAGE_DESTINATION_ARGS: --destination $CI_REGISTRY_IMAGE:dev
    - if: $CI_COMMIT_TAG != null
      variables:
        IMAGE_DESTINATION_ARGS: >
          --destination $CI_REGISTRY_IMAGE:latest
          --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    # Don't run on feature branches if there is a MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: >
        $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH &&
        $CI_COMMIT_BRANCH != null
      variables:
        IMAGE_DESTINATION_ARGS: --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  # IMAGE_DESTINATION_ARGS will be set inside the script
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: ['']
  script:
    # According to https://docs.docker.com/engine/reference/commandline/tag/
    # the tag may contain lowercase and uppercase letters, digits, underscores,
    # periods, and hyphens, so we replace everything else by '_'. It cannot start
    # with a period or hyphen, so we replace those if we find them at the start of a line.
    # It must be no longer than 128 characters, so we truncate it in addition.
    #
    # tr -c means the same as --complement, but busybox tr doesn't have that
    - >
      if [ $CI_PIPELINE_SOURCE == 'merge_request_event' ]; then
        IMAGE_TAG=$(
          echo -n "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" |
          tr -c '[:alnum:]_.-' '_' |
          sed 's/^[.-]/_/' |
          cut -c -128
        );
        IMAGE_DESTINATION_ARGS="--destination $CI_REGISTRY_IMAGE:$IMAGE_TAG";
      fi
    - mkdir -p /kaniko/.docker
    - >
      echo
      "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" >
      /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --registry-mirror=mirror.gcr.io
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/ci/Dockerfile
      $IMAGE_DESTINATION_ARGS
      --force
