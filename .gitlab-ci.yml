# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Rust.gitlab-ci.yml

# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/rust/tags/
image: "rust:latest"

# Optional: Pick zero or more services to be used on all builds.
# Only needed when using a docker container to run your tests in.
# Check out: https://docs.gitlab.com/ee/ci/services/index.html
# services:
#   - mysql:latest
#   - redis:latest
#   - postgres:latest

# Optional: Install a C compiler, cmake and git into the container.
# You will often need this when you (or any of your dependencies) depends on C code.
before_script:
   - uname -a
   - apt-get update -yqq
   - apt-get install -yqq --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev 
   - apt-get install -yqq --no-install-recommends gstreamer1.0-plugins-base gstreamer1.0-plugins-good
   - apt-get install -yqq --no-install-recommends gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly
   - apt-get install -yqq --no-install-recommends gstreamer1.0-libav libgstrtspserver-1.0-dev libges-1.0-dev

# Use cargo to test the project
doc:cargo:
  script:
    - rustc --version && cargo --version  # Print version info for debugging
    - cargo doc --workspace --verbose
