[workspace]
members = ["opentalk-recorder", "opentalk-recorder-web-api"]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
repository = "https://gitlab.opencode.de/opentalk/recorder"
version = "0.15.0"

[workspace.dependencies]
opentalk-recorder-web-api = { path = "opentalk-recorder-web-api", version = "0.15.0" }

anstream = "0.6"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = "0.4"
clap = "4.5"
cocoa = "0.26"
compositor = { package = "opentalk-compositor", version = "0.16" }
config = { version = "0.15", default-features = false }
directories = "6.0"
env_logger = "0.11"
futures = "0.3"
gst = { package = "gstreamer", version = "0.23" }
itertools = "0.14"
jsonwebtoken = "9.3"
log = "0.4"
objc = "0.2"
openidconnect = "4"
opentalk-client = { package = "opentalk-client-signaling", version = "0.1" }
opentalk-service-auth = "0.1"
opentalk-version = "0.3"
owo-colors = "4.2"
pin-project-lite = "0.2"
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
service-probe = "0.3"
service-probe-client = "0.3"
sysinfo = "0.37"
thiserror = "2"
tokio = "1"

tokio-stream = "0.1"
tokio-tungstenite = { version = "0.27", features = [
  "rustls",
  "rustls-tls-native-roots",
] }
tokio-tungstenite-20 = { version = "0.20", features = [
  "rustls",
  "rustls-tls-native-roots",
], package = "tokio-tungstenite" }
urlencoding = "2.1"

[patch.crates-io]
livekit-runtime = { git = "https://github.com/kbalt/rust-sdks.git", rev = "702f3ffa72a6b312b66cb658709eb64595d51b84" }
