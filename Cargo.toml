[workspace]
members = ["opentalk-recorder", "opentalk-recorder-web-api"]
resolver = "2"

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
repository = "https://gitlab.opencode.de/opentalk/recorder"
version = "0.15.0"

[workspace.dependencies]
opentalk-recorder-web-api = { path = "opentalk-recorder-web-api", version = "0.15.0" }

opentalk-types-api-internal = "0.1.1"

anstream = "1.0"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = "4.5"
cocoa = "0.26"
compositor = { package = "opentalk-compositor", version = "0.17" }
config = { version = "0.15", default-features = false }
directories = "6.0"
env_logger = "0.11"
futures = "0.3"
gst = { package = "gstreamer", version = "0.24" }
itertools = "0.14"
log = "0.4"
objc = "0.2"
opentalk-client = { package = "opentalk-client-signaling", version = "0.3" }
opentalk-service-auth = "0.2"
opentalk-version = "0.4"
owo-colors = "4.2"
pin-project-lite = "0.2"
reqwest = { version = "0.13", default-features = false }
serde = "1"
serde_json = "1"
service-probe = "0.4"
service-probe-client = "0.4"
sysinfo = "0.38"
thiserror = "2"
tokio = "1"

tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = [
  "rustls",
  "rustls-tls-native-roots",
] }
tokio-tungstenite-20 = { version = "0.20", features = [
  "rustls",
  "rustls-tls-native-roots",
], package = "tokio-tungstenite" }
urlencoding = "2.1"
