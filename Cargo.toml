[package]
name = "opentalk-recorder"
version = "0.16.0"
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2021"
homepage = "https://opentalk.eu/"
repository = "https://gitlab.opencode.de/opentalk/recorder"
license = "EUPL-1.2"
build = "build.rs"
publish = false

[dependencies]
anstream = "1.0"
anyhow = { version = "1", features = ["backtrace"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
compositor = { package = "opentalk-compositor", version = "0.17" }
config = { version = "0.15", default-features = false, features = ["toml"] }
directories = "6.0"
env_logger = "0.11"
futures = "0.3"
gst = { package = "gstreamer", version = "0.23" }
itertools = "0.14"
lapin = "4.0"
log = "0.4"
openidconnect = "4"
opentalk-client = { package = "opentalk-client-signaling", version = "0.2" }
opentalk-version = "0.4"
owo-colors = "4.2"
pin-project-lite = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
service-probe = "0.4"
service-probe-client = "0.4"
sysinfo = "0.38"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "time",
  "macros",
  "fs",
  "signal",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
urlencoding = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[build-dependencies]
anyhow = "1"
opentalk-version = "0.4"
