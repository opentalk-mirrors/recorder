[package]
name = "opentalk-recorder"
version.workspace = true
edition = "2021"
license = "EUPL-1.2"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
types = { package = "opentalk-types", version = "0.19.0" }

[dependencies]
compositor = { path = "compositor" }
types = { workspace = true, features = ["rand", "serde"] }

gst = { package = "gstreamer", version = "0.23" }
gst-sdp = { package = "gstreamer-sdp", version = "0.23" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.23", features = [
    "v1_22",
] }
gst-plugin-inter = "0.13.0"
tt = { package = "tokio-tungstenite", version = "0.20", features = [
    "rustls-tls-webpki-roots",
] }
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-native-roots",
] }
config = { version = "0.14", default-features = false, features = ["toml"] }
env_logger = "0.11"
anyhow = { version = "1", features = ["backtrace"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "time",
    "macros",
    "fs",
    "signal",
] }
#lapin = "2.1"
lapin = { version = "2.3", default-features = false, features = [
    "rustls-webpki-roots-certs",
] }
tokio-reactor-trait = "1"
tokio-executor-trait = "2"
futures = "0.3"
log = "0.4"
serde_json = "1"
bytes = "1"
thiserror = "1"
openidconnect = "3"
tempfile = "3"
pin-project-lite = "0.2"
sysinfo = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[workspace]
members = ["compositor"]

[workspace.package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
version = "0.0.0-dev"
