[package]
authors = ["OpenTalk Team <mail@opentalk.eu>"]
edition = "2021"
homepage = "https://opentalk.eu/"
license = "EUPL-1.2"
name = "opentalk-recorder"
publish = false
repository = "https://gitlab.opencode.de/opentalk/recorder"
version = "0.15.0"
build = "build.rs"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
bytes = "1"
chrono = "0.4"
compositor = { package = "opentalk-compositor", version = "0.16" }
config = { version = "0.15", default-features = false, features = ["toml"] }
env_logger = "0.11"
futures = "0.3"
gst = { package = "gstreamer", version = "0.23" }
jsonwebtoken = "9.3"
lapin = { version = "3.4", default-features = false, features = [
  "rustls-webpki-roots-certs",
] }
log = "0.4"
openidconnect = "4"
pin-project-lite = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls-native-roots",
] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.37"
thiserror = "2"
tokio-executor-trait = "3"
tokio-reactor-trait = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "time",
  "macros",
  "fs",
  "signal",
] }
opentalk-client = { package = "opentalk-client-signaling", version = "0.1" }
urlencoding = "2.1"
service-probe = "0.3"
service-probe-client = "0.3"
clap = { version = "4.5", features = ["derive"] }
opentalk-version = "0.3"
directories = "6.0"
anstream = "0.6"
itertools = "0.14"
owo-colors = "4.2"
tokio-stream = { version = "0.1.17", features = ["sync"] }

tokio-tungstenite = { version = "0.27", features = [
  "rustls",
  "rustls-tls-native-roots",
] }
tokio-tungstenite-20 = { version = "0.20", features = [
  "rustls",
  "rustls-tls-native-roots",
], package = "tokio-tungstenite" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[build-dependencies]
anyhow = "1"
opentalk-version = "0.3"

[patch.crates-io]
livekit-runtime = { git = "https://github.com/kbalt/rust-sdks.git", rev = "702f3ffa72a6b312b66cb658709eb64595d51b84" }

[package.metadata.cargo-machete]
ignored = ["tokio-tungstenite"]
