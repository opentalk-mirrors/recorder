[package]
authors.workspace = true
description = "GStreamer based compositor for the OpenTalk Recorder and Obelisk"
documentation = "https://docs.rs/opentalk-compositor"
edition = "2021"
homepage.workspace = true
license = "EUPL-1.2"
name = "opentalk-compositor"
publish = true
repository.workspace = true
version.workspace = true
exclude = ["/images/"]

[dependencies]
types.workspace = true

gst = { package = "gstreamer", version = "0.23", features = ["v1_22"] }
gst-base = { package = "gstreamer-base", version = "0.23", features = ["v1_22"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.23" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.23", features = [
    "v1_22",
] }
gst-plugin-inter = "0.13.0"
log = "0.4"
glib = "0.20"
tokio = { version = "1", features = [
    "sync",
    "net",
    "macros",
    "rt-multi-thread",
    "time",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12.3"
once_cell = "1.19"

[dev-dependencies]
env_logger = "0.11"
glob = "0.3"
