[package]
name = "compositor"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gstreamer = { version="0.18", features=["v1_20"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.18" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.18", features = [
    "v1_20",
] }

clap = { version = "3.x", features = ["derive"] }
log = "0.4.0"
env_logger = "0.9.0"
tokio = { version = "1", features = ["sync"] }