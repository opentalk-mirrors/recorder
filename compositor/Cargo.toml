[package]
name = "compositor"
version = "0.1.1"
edition = "2021"
authors.workspace = true
license = "EUPL-1.2"
publish = false

[dependencies]
types.workspace = true

gst = { package = "gstreamer", version = "0.22", features = ["v1_22"] }
gst-app = { package = "gstreamer-app", version = "0.22" }
gst-base = { package = "gstreamer-base", version = "0.22", features = ["v1_22"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.22" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.22", features = [
    "v1_22",
] }
log = "0.4"
glib = "0.19"
tokio = { version = "1", features = [
    "sync",
    "net",
    "macros",
    "rt-multi-thread",
    "time",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
env_logger = "0.11"
glob = "0.3"
