[auth]
issuer = "http://localhost:8080/auth/realms/MyRealm"
client_id = "Recorder"
client_secret = "INSERT_KEY"

[controller]
domain = "localhost:11311"
insecure = true

[rabbitmq]
uri = "amqp://guest:guest@p01nc.heinlein-video.de/%2F"
queue = "recorder"


[recorder]

[[recorder.sinks]]
type = "display"

[[recorder.sinks]]
type = "rtmp"
location = "rtmp://localhost:1935/live/$room live=1"
# optional
#audio_bitrate = 96000
#audio_rate = 48000
#video_bitrate = 6000
#video_speed_preset = fast
