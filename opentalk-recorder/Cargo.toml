[package]
authors.workspace = true
build = "build.rs"
default-run = "opentalk-recorder"
edition.workspace = true
license.workspace = true
name = "opentalk-recorder"
publish = false
version.workspace = true

[dependencies]
anstream.workspace = true
anyhow = { workspace = true, features = ["backtrace"] }
async-trait.workspace = true
axum = { workspace = true, features = ["macros"] }
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
opentalk-compositor.workspace = true
config = { workspace = true, features = ["toml"] }
directories.workspace = true
env_logger.workspace = true
jsonwebtoken.workspace = true
futures.workspace = true
gstreamer.workspace = true
itertools.workspace = true
log.workspace = true
opentalk-client-signaling.workspace = true
opentalk-orchestrator-client = { workspace = true, features = [
  "recording-service",
] }
opentalk-recorder-web-api.workspace = true
opentalk-service-auth = { workspace = true, features = ["axum"] }
opentalk-types-api-internal.workspace = true
opentalk-version.workspace = true
owo-colors.workspace = true
pin-project-lite.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_ignored.workspace = true
serde_path_to_error.workspace = true
service-probe.workspace = true
service-probe-client.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-stream = { workspace = true, features = ["sync"] }
urlencoding.workspace = true

# Required for roomserver-client
tokio-tungstenite.workspace = true

# Pinning protocol version due to breaking changes in 0.7.12 which have not yet been fixed in the livekit crate
livekit-protocol = "=0.7.11"

[build-dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
opentalk-version.workspace = true
tokio-stream.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true

[package.metadata.cargo-machete]
ignored = ["tokio-tungstenite", "livekit-protocol"]
